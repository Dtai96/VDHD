<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký - CyberAware</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            background: #0f172a; 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-family: 'Segoe UI', system-ui, sans-serif; 
        }
        .register-card { 
            width: 100%; 
            max-width: 440px; 
            background: #1e293b; 
            border-radius: 16px; 
            border: 1.5px solid #475569; /* Tăng độ tương phản viền khung */
            color: #ffffff; 
        }

        /* TĂNG ĐỘ RÕ NÉT VÀ ĐẬM MÀU CHO CÁC Ô NHẬP LỆU (INPUT) */
        .form-control { 
            background-color: #0f172a; 
            border: 1.5px solid #475569; 
            color: #ffffff !important; 
            font-weight: 500;
        }
        .form-control::placeholder {
            color: #94a3b8 !important; /* Gợi ý ô nhập sáng, rõ hơn */
            opacity: 1;
        }
        .form-control:focus { 
            background-color: #0f172a; 
            border-color: #22c55e; 
            color: #ffffff; 
            box-shadow: 0 0 0 0.25rem rgba(34, 197, 94, 0.25); 
        }

        /* GHI ĐÈ CLASS LÀM MỜ VĂN BẢN (TEXT-MUTED) */
        .text-muted { 
            color: #cbd5e1 !important; /* Đổi sang màu xám sáng rõ nét */
            opacity: 1 !important;
        }

        /* Icon trong Input Group sáng rõ nét */
        .input-group-text {
            background-color: #0f172a !important;
            border-color: #475569 !important;
            color: #22c55e !important; /* Đổi icon sang màu xanh lá nổi bật */
        }

        /* Link Đăng nhập rõ hơn */
        .text-success-link {
            color: #4ade80 !important;
            font-weight: 700;
        }
    </style>
</head>
<body>

<div class="register-card p-4 p-sm-5 shadow-lg">
    <div class="text-center mb-4">
        <i class="fa-solid fa-user-plus fa-3x text-success mb-2"></i>
        <h3 class="fw-bold text-white">Tạo Tài Khoản</h3>
        <p class="text-muted fw-semibold small">Tham gia chương trình diễn tập an toàn thông tin</p>
    </div>

    <div id="alertMsg" class="alert d-none" role="alert"></div>

    <form id="registerForm">
        <div class="mb-3">
            <label class="form-label text-white fw-bold">Họ và Tên</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-id-card"></i></span>
                <input type="text" id="name" class="form-control" placeholder="Ví dụ: Nguyễn Văn An" required>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label text-white fw-bold">Tên đăng nhập</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                <input type="text" id="username" class="form-control" placeholder="Viết liền không dấu" required>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label text-white fw-bold">Mật khẩu</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                <input type="password" id="password" class="form-control" placeholder="Mật khẩu" required>
            </div>
        </div>

        <button type="submit" class="btn btn-success w-100 py-2.5 fw-bold mb-3 fs-6">
            <i class="fa-solid fa-check-circle me-2"></i>Đăng Ký Tài Khoản
        </button>
    </form>

    <div class="text-center mt-3">
        <span class="text-muted small">Đã có tài khoản? </span>
        <a href="/login" class="text-success-link text-decoration-none small">Đăng nhập</a>
    </div>
</div>

<script>
    document.getElementById('registerForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const name = document.getElementById('name').value;
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const alertMsg = document.getElementById('alertMsg');

        fetch('/register', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ name, username, password })
        })
        .then(res => res.json())
        .then(data => {
            if(data.status === 'success') {
                alertMsg.className = 'alert alert-success fw-bold';
                alertMsg.innerText = data.message;
                alertMsg.classList.remove('d-none');
                setTimeout(() => window.location.href = '/login', 1500);
            } else {
                alertMsg.className = 'alert alert-danger fw-bold';
                alertMsg.innerText = data.message;
                alertMsg.classList.remove('d-none');
            }
        });
    });
</script>

</body>
</html>
