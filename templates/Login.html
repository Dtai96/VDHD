<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - CyberAware</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            background: #0f172a; 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-family: 'Segoe UI', system-ui, sans-serif; 
        }
        .login-card { 
            width: 100%; 
            max-width: 420px; 
            background: #1e293b; 
            border-radius: 16px; 
            border: 1.5px solid #475569; /* Tăng độ dày và tương phản của viền khung */
            color: #ffffff; 
        }

        /* TĂNG ĐỘ RÕ NÉT VÀ ĐẬM MÀU CHO CÁC Ô NHẬP LỆU (INPUT) */
        .form-control { 
            background-color: #0f172a; 
            border: 1.5px solid #475569; 
            color: #ffffff !important; 
            font-weight: 500;
        }
        .form-control::placeholder {
            color: #94a3b8 !important; /* Màu chữ gợi ý trong ô sáng hơn, rõ hơn */
            opacity: 1;
        }
        .form-control:focus { 
            background-color: #0f172a; 
            border-color: #3b82f6; 
            color: #ffffff; 
            box-shadow: 0 0 0 0.25rem rgba(59, 130, 246, 0.25); 
        }

        /* GHI ĐÈ CLASS LÀM MỜ VĂN BẢN (TEXT-MUTED / TEXT-SECONDARY) */
        .text-muted, .text-secondary { 
            color: #cbd5e1 !important; /* Đổi từ màu mờ sang màu xám sáng rõ nét */
            opacity: 1 !important;
        }
        
        /* Icon trong input sáng rõ nét hơn */
        .input-group-text {
            background-color: #0f172a !important;
            border-color: #475569 !important;
            color: #3b82f6 !important; /* Đổi màu Icon sang xanh nổi bật */
        }

        /* Nút Đăng ký và Badges nổi bật hơn */
        .text-primary-link {
            color: #60a5fa !important;
            font-weight: 700;
        }
        .badge-custom {
            font-size: 0.85rem;
            padding: 6px 10px;
        }
    </style>
</head>
<body>

<div class="login-card p-4 p-sm-5 shadow-lg">
    <div class="text-center mb-4">
        <i class="fa-solid fa-shield-virus fa-3x text-primary mb-2"></i>
        <h3 class="fw-bold text-white">CyberAware</h3>
        <p class="text-muted fw-semibold small">Đăng nhập hệ thống đào tạo an ninh mạng</p>
    </div>

    <div id="alertMsg" class="alert alert-danger d-none" role="alert"></div>

    <form id="loginForm">
        <div class="mb-3">
            <label class="form-label text-white fw-bold">Tên đăng nhập</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                <input type="text" id="username" class="form-control" placeholder="Tên đăng nhập" required>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label text-white fw-bold">Mật khẩu</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                <input type="password" id="password" class="form-control" placeholder="Mật khẩu" required>
            </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2.5 fw-bold mb-3 fs-6">
            <i class="fa-solid fa-right-to-bracket me-2"></i>Đăng Nhập
        </button>
    </form>

    <div class="text-center mt-3">
        <span class="text-muted small">Chưa có tài khoản? </span>
        <a href="/register" class="text-primary-link text-decoration-none small">Đăng ký ngay</a>
    </div>

    <div class="mt-4 pt-3 border-top border-secondary text-center">
        <small class="text-muted d-block mb-2 fw-semibold">Tài khoản mặc định thử nghiệm:</small>
        <div class="d-flex justify-content-center gap-2">
            <span class="badge bg-danger badge-custom">Admin: admin / 123</span>
            <span class="badge bg-secondary badge-custom text-white">User: nguyenvanan / 123</span>
        </div>
    </div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const alertMsg = document.getElementById('alertMsg');

        fetch('/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ username, password })
        })
        .then(res => res.json())
        .then(data => {
            if(data.status === 'success') {
                window.location.href = '/';
            } else {
                alertMsg.innerText = data.message;
                alertMsg.classList.remove('d-none');
            }
        });
    });
</script>

</body>
</html>
